name: Deploy Site

on:
    - push
    - pull_request
    - workflow_dispatch

permissions:
    contents: read
    packages: read

jobs:
    run-project-linter:
        name: Run Project Linter
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version: "24.13.1"
            - name: Install Dependencies
              run: npm ci
            - name: Run Linter
              run: npm run lint

    run-super-linter:
        name: Run GitHub Super Linter
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
            statuses: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version: "24.13.1"
            - name: Install Dependencies
              run: npm ci
            - name: Lint Code Base
              uses: super-linter/super-linter@61abc07d755095a68f4987d1c2c3d1d64408f1f9 # v8.5.0
              env:
                  DEFAULT_BRANCH: main
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  IGNORE_GITIGNORED_FILES: "true"
                  TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js
                  LINTER_RULES_PATH: .
                  CSS_FILE_NAME: stylelint.config.js
                  SAVE_SUPER_LINTER_SUMMARY: "true"
                  ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: "true"
                  ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: "true"
                  VALIDATE_ALL_CODEBASE: "true"
                  VALIDATE_HTML: "false"
                  VALIDATE_JAVASCRIPT_ES: "false"
                  VALIDATE_JAVASCRIPT_STANDARD: "false"
                  VALIDATE_TYPESCRIPT_STANDARD: "false"
                  VALIDATE_CSS_PRETTIER: "false"
                  VALIDATE_BIOME_FORMAT: "false"
                  VALIDATE_BIOME_LINT: "false"
                  VALIDATE_MARKDOWN: "false"
                  VALIDATE_CHECKOV: "false"
                  VALIDATE_EDITORCONFIG: "false"

    run-vulnerability-analysis:
        name: Run Vulnerability Analysis
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
            security-events: write
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
              with:
                  scan-type: fs
                  vuln-type: library
                  exit-code: 0
                  format: sarif
                  output: trivy-results.sarif
                  ignore-unfixed: true
            - name: Upload Trivy scan results to GitHub Security tab
              uses: github/codeql-action/upload-sarif@45cbd0c69e560cd9e7cd7f8c32362050c9b7ded2 # v4.32.2
              if: always()
              with:
                  sarif_file: trivy-results.sarif

    run-e2e-tests:
        strategy:
            matrix:
                browser:
                    - electron
                    - chrome
                    - firefox
                    - edge
        name: Run E2E Tests (${{ matrix.browser }})
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version: "24.13.1"
            - name: Install Dependencies
              run: npm ci
            - name: Instrument Website for Code Coverage
              run: |
                  npx nyc instrument --in-place --compact=false .
                  npm run build
              env:
                  BUILD_TYPE: test
                  NODE_ENV: development
            - name: Run E2E Tests
              uses: cypress-io/github-action@84d178e4bbce871e23f2ffa3085898cde0e4f0ec # v7.1.2
              with:
                  start: bash .github/scripts/start-server.sh
                  browser: ${{ matrix.browser }}
                  record: true
                  tag: prebuild-test-in-browser-${{ matrix.browser }}
              env:
                  WEBSITE_BUILD_DIR: out
                  CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
                  CYPRESS_BASE_URL: https://nadundesilva.com
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Shutdown Test Server
              run: bash .github/scripts/stop-server.sh
            - name: Upload Code Coverage to CodeCov
              if: ${{ github.event_name == 'push' }}
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  name: coverage-reports
                  flags: e2e-tests
                  fail_ci_if_error: true
                  verbose: true
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
            - name: Upload Test Results Artifacts
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: e2e-test-results-${{ matrix.browser }}
                  path: |
                      cypress/videos/
                      cypress/screenshots/
            - name: Upload Code Coverage Report Artifacts
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: e2e-tests-coverage-${{ matrix.browser }}
                  path: coverage/

    build-site:
        name: Build Site
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version: "24.13.1"
            - name: Install Dependencies
              run: npm ci
            - name: Build Site
              run: |
                  export PUBLIC_URL="https://${DOMAIN_NAME}"
                  npm run build
                  touch ./out/.nojekyll
                  echo "${DOMAIN_NAME}" > ./out/CNAME
              env:
                  DOMAIN_NAME: nadundesilva.com
                  SENTRY_RELEASE: ${{ github.sha }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
            - name: Upload Site
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: site
                  path: out/
            - name: Upload Unit Tests Code Coverage Report
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: unit-tests-coverage
                  path: coverage/

    check-links:
        name: Check Links in Website
        runs-on: ubuntu-latest
        needs: build-site
        env:
            # Hostnames and status codes are in the same order.
            BOT_RESTRICTED_WEBSITES_PATTERN: 'medium\.com|instagram\.com|linkedin\.com|scholar\.google\.com'
            BOT_RESTRICTED_STATUS_CODES: "403,429,999"
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version: "24.13.1"
            - name: Install Dependencies
              run: npm ci
            - name: Download Site
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: site
                  path: _site/
            - name: Start Server
              run: |
                  source ./.github/scripts/start-server.sh
              env:
                  WEBSITE_BUILD_DIR: _site
            - name: Link Checker (General)
              id: lychee
              uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2.7.0
              with:
                  args: --verbose --no-progress --exclude "${{ env.BOT_RESTRICTED_WEBSITES_PATTERN }}" https://nadundesilva.com/
                  output: ./lychee/out-general.md
                  fail: true
                  failIfEmpty: true
            - name: Link Checker (Bot-Protected Sites)
              id: lychee-restricted
              uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2.7.0
              with:
                  args: --verbose --no-progress --include "${{ env.BOT_RESTRICTED_WEBSITES_PATTERN }}" --accept "200,${{ env.BOT_RESTRICTED_STATUS_CODES }}" https://nadundesilva.com/
                  output: ./lychee/out-restricted.md
                  fail: true
                  failIfEmpty: true
            - name: Stop Server
              run: |
                  source ./.github/scripts/stop-server.sh
              env:
                  WEBSITE_BUILD_DIR: _site
            - name: Upload Link Checker Report
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: link-checker-report
                  path: ./lychee/

    check-site-build:
        strategy:
            matrix:
                browser:
                    - electron
                    - chrome
                    - firefox
                    - edge
        name: Check Site Build (${{ matrix.browser }})
        runs-on: ubuntu-latest
        needs: build-site
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version: "24.13.1"
            - name: Install Dependencies
              run: npm ci
            - name: Download Site
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: site
                  path: _site/
            - name: Run E2E Tests
              uses: cypress-io/github-action@84d178e4bbce871e23f2ffa3085898cde0e4f0ec # v7.1.2
              with:
                  start: bash .github/scripts/start-server.sh
                  browser: ${{ matrix.browser }}
                  record: true
                  tag: check-site-build-in-browser-${{ matrix.browser }}
              env:
                  WEBSITE_BUILD_DIR: _site
                  CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
                  CYPRESS_BASE_URL: https://nadundesilva.com
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Shutdown Test Server
              run: bash .github/scripts/stop-server.sh
            - name: Upload artifacts
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: site-build-e2e-test-results-${{ matrix.browser }}
                  path: |
                      cypress/videos/
                      cypress/screenshots/

    run-website-audit:
        name: Run Website Audit
        runs-on: ubuntu-latest
        needs: build-site
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  sparse-checkout-cone-mode: false
                  sparse-checkout: |
                      .github
                      .lighthouserc.cjs
            - name: Download Site
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: site
                  path: _site/
            - name: Setup Node.js
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version: "24.13.1"
            - name: Run Lighthouse Audit
              run: |
                  ls -la
                  npm install -g @lhci/cli@0.15.x
                  source ./.github/scripts/start-server.sh
                  lhci autorun
                  source ./.github/scripts/stop-server.sh
              env:
                  WEBSITE_BUILD_DIR: _site
                  LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Upload artifacts
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: website-audit
                  path: ./lhci-out

    deploy-site:
        name: Deploy Site
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        permissions:
            contents: write
        needs:
            - run-super-linter
            - run-project-linter
            - run-vulnerability-analysis
            - run-e2e-tests
            - build-site
            - check-links
            - run-website-audit
            - check-site-build
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Download Site
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: site
                  path: _site/
            - name: Setup Node.js
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version: "24.13.1"
                  package-manager-cache: false
            - name: Deploy
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: "_site"
                  command: |
                      pages deploy . --project-name=personal-website --branch=production --commit-dirty=true
